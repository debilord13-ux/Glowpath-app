<title id="title">Glowpath — иллюстрации медиатеки и плеера</title>
<desc id="desc">Два примера интерфейса по разметке приложения: локальная медиатека с мини-плеером и большой плеер с обложкой, управлением и очередью. Названия треков и обложки вымышлены. Это иллюстрации, а не снимки работающего приложения.</desc>
