name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Новый пуш в ветку отменяет ещё идущую сборку той же ветки. Это исключает
# параллельные прогоны, которые зря жгут минуты и усиливают лимитирование
# со стороны Maven Central.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # SDK-джарки Robolectric кэшируются отдельно: их скачивает
      # ci/fetch-robolectric-sdk.sh, и пока кэш жив, Maven Central не
      # запрашивается вовсе — тесты больше не зависят от его HTTP 429.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: app/robolectric-sdk-jars
          key: robolectric-sdk-jars-v1

      - name: Fetch Robolectric SDK jars
        run: bash ci/fetch-robolectric-sdk.sh

      # Кэш ~/.gradle между запусками: зависимости и дистрибутив Gradle
      # скачиваются один раз, после чего Maven Central не запрашивается вовсе.
      # Раньше каждый прогон качал сотни артефактов заново и периодически
      # получал HTTP 429 (Too Many Requests) от Maven Central.
      - name: Set up Gradle (dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ci/gradle-retry.sh повторяет задачу до 3 раз, но только при сетевых
      # сбоях (HTTP 429/5xx, таймауты) — ошибки компиляции и тестов он
      # не маскирует и завершает шаг сразу.
      - name: Test player and library interactions
        run: bash ci/gradle-retry.sh testDebugUnitTest

      # Ключ подписи лежит в репозитории (signing/glowpath.keystore) и один и тот же
      # для всех сборок — поэтому обновление APK ставится поверх предыдущей версии
      # без ошибки «приложение конфликтует с другим пакетом». Секреты больше не нужны.
      - name: Build signed Release APK
        run: bash ci/gradle-retry.sh assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowPath-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
