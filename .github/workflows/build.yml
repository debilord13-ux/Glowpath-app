name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test player and library interactions
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Restore release signing key
        env:
          GLOWPATH_KEYSTORE_BASE64: ${{ secrets.GLOWPATH_KEYSTORE_BASE64 }}
        run: |
          test -n "$GLOWPATH_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$GLOWPATH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glowpath-release.keystore"
          test -s "$RUNNER_TEMP/glowpath-release.keystore"

      - name: Build signed Release APK
        env:
          GLOWPATH_KEYSTORE_PATH: ${{ runner.temp }}/glowpath-release.keystore
          GLOWPATH_KEYSTORE_PASSWORD: ${{ secrets.GLOWPATH_KEYSTORE_PASSWORD }}
          GLOWPATH_KEY_ALIAS: glowpath-release
          GLOWPATH_KEY_PASSWORD: ${{ secrets.GLOWPATH_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowPath-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
