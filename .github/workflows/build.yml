name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test player and library interactions
        run: ./gradlew testDebugUnitTest --stacktrace

      # Ключ подписи лежит в репозитории (signing/glowpath.keystore) и один и тот же
      # для всех сборок — поэтому обновление APK ставится поверх предыдущей версии
      # без ошибки «приложение конфликтует с другим пакетом». Секреты больше не нужны.
      - name: Build signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowPath-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
