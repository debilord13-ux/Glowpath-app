org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
# Maven Central ограничивает частоту запросов и нередко отвечает HTTP 429
# (Too Many Requests), особенно с общих IP GitHub Actions. Увеличиваем число
# попыток скачивания артефактов и паузу между ними (обратный отсчёт в мс).
org.gradle.internal.repository.max.tentatives=6
org.gradle.internal.repository.initial.backoff=1500
